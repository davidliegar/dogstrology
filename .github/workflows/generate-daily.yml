# Genera el diario contra la Batch API y abre un PR con el resultado ya
# filtrado (BRD §7.4, Capa 2: GitHub Action → Batch API → filtro → PR →
# revisión humana → merge → Cloudflare Pages).
#
# DESACTIVADA A PROPÓSITO: el `schedule` del cron nocturno está comentado.
# De momento solo se puede lanzar a mano (`workflow_dispatch`), mientras el
# pipeline se sigue validando con contenido de prueba. Para activar el cron:
# descomentar el bloque `schedule` de abajo y confirmar que el secreto
# ANTHROPIC_API_KEY está configurado en Settings → Secrets and variables →
# Actions del repo (nunca en el código ni en el repo, BRD §7.4).
name: Generar contenido diario

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha a generar (AAAA-MM-DD). Vacío = hoy + 7 días (buffer de F12)'
        required: false
  # schedule:
  #   - cron: '0 3 * * *' # 03:00 UTC cada noche

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # El batch puede tardar hasta 1h (BRD §7.4); se deja margen de sobra.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dos instalaciones, y las dos hacen falta. `pipeline` importa
      # `proto/astro.mjs` para leer el cielo del día, y Node resuelve las
      # dependencias de ese fichero desde **su** carpeta: `proto/node_modules`
      # y luego la raíz del repo, nunca `pipeline/node_modules`. Sin esta
      # segunda línea el workflow muere en el primer `import` con un
      # ERR_MODULE_NOT_FOUND de `astronomy-engine`, y en local no se nota
      # porque `proto/node_modules` ya está desde el prototipo.
      - name: Instalar dependencias del pipeline
        working-directory: pipeline
        run: npm ci

      - name: Instalar el motor astrológico
        working-directory: proto
        run: npm ci

      - name: Calcular fecha objetivo
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "value=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u -d '+7 days' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar el diario contra la Batch API
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/generateDaily.mjs --date "${{ steps.date.outputs.value }}" --confirm

      # Red de seguridad, y no es paranoia: el paso de arriba **cuesta dinero y
      # no es repetible barato** (un lote de 37 contra la Batch API, hasta una
      # hora). Todo lo que viene después es fontanería de git, y si falla —un
      # permiso, un conflicto de rama— el contenido ya pagado se iría con la
      # máquina. Guardado como artefacto se puede recuperar y commitear a mano.
      - name: Guardar el contenido generado, pase lo que pase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diario-${{ steps.date.outputs.value }}
          path: content/daily/${{ steps.date.outputs.value }}.*
          if-no-files-found: warn
          retention-days: 30

      - name: Leer el informe del filtro para el cuerpo del PR
        id: report
        run: |
          {
            echo 'text<<EOF_REPORT'
            cat "content/daily/${{ steps.date.outputs.value }}.report.md"
            echo EOF_REPORT
          } >> "$GITHUB_OUTPUT"

      - name: Abrir PR con el contenido generado
        uses: peter-evans/create-pull-request@v6
        with:
          branch: content/daily-${{ steps.date.outputs.value }}
          commit-message: "contenido: diario ${{ steps.date.outputs.value }}"
          title: "Contenido diario — ${{ steps.date.outputs.value }}"
          body: ${{ steps.report.outputs.text }}
          add-paths: |
            content/daily/${{ steps.date.outputs.value }}.json
            content/daily/${{ steps.date.outputs.value }}.report.md
