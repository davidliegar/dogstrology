# Genera el diario contra la Batch API y abre un PR con el resultado ya
# filtrado (BRD §7.4, Capa 2: GitHub Action → Batch API → filtro → PR →
# revisión humana → merge → Cloudflare Pages).
#
# ACTIVA desde el 2026-08-30: el cron nocturno genera un día por noche y
# mantiene el colchón de siete. El secreto ANTHROPIC_API_KEY vive en Settings →
# Secrets and variables → Actions (nunca en el código ni en el repo, BRD §7.4).
#
# Para llenar el colchón de golpe —la primera vez, o si se queda atrás— se
# lanza a mano con `date` y `days`: ver `--days` en `generateDaily.mjs`.
# Cada noche cuesta ~0,40 €.
name: Generar contenido diario

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Primer día a generar (AAAA-MM-DD). Vacío = hoy + 7 días (buffer de F12)'
        required: false
      days:
        description: 'Cuántos días consecutivos, en UN solo lote. 1 para el cron; 8 para llenar el colchón la primera vez'
        required: false
        default: '1'
  schedule:
    # 03:00 UTC cada noche. Genera hoy + 7, así que el colchón se mantiene
    # rodando y la edición de un día está publicada mucho antes de que ese día
    # empiece en España — que es lo que necesita la app, porque pide la fecha
    # **local** (ver `content/domain/DailyDate`).
    - cron: '0 3 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # El batch puede tardar hasta 1h (BRD §7.4); se deja margen de sobra.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dos instalaciones, y las dos hacen falta. `pipeline` importa
      # `proto/astro.mjs` para leer el cielo del día, y Node resuelve las
      # dependencias de ese fichero desde **su** carpeta: `proto/node_modules`
      # y luego la raíz del repo, nunca `pipeline/node_modules`. Sin esta
      # segunda línea el workflow muere en el primer `import` con un
      # ERR_MODULE_NOT_FOUND de `astronomy-engine`, y en local no se nota
      # porque `proto/node_modules` ya está desde el prototipo.
      - name: Instalar dependencias del pipeline
        working-directory: pipeline
        run: npm ci

      - name: Instalar el motor astrológico
        working-directory: proto
        run: npm ci

      - name: Calcular el tramo a generar
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            start="${{ github.event.inputs.date }}"
          else
            start="$(date -u -d '+7 days' +%F)"
          fi
          days="${{ github.event.inputs.days || 1 }}"
          echo "value=$start" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "last=$(date -u -d "$start +$((days - 1)) days" +%F)" >> "$GITHUB_OUTPUT"
          if [ "$days" -eq 1 ]; then
            echo "label=$start" >> "$GITHUB_OUTPUT"
          else
            echo "label=$start … $(date -u -d "$start +$((days - 1)) days" +%F)" >> "$GITHUB_OUTPUT"
          fi

      # Un solo lote para todos los días: un batch tarda lo que tarda —hasta una
      # hora— así que ocho días en uno cuestan una espera y no ocho.
      - name: Generar el diario contra la Batch API
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node src/generateDaily.mjs \
            --date "${{ steps.date.outputs.value }}" \
            --days "${{ steps.date.outputs.days }}" \
            --confirm

      # Red de seguridad, y no es paranoia: el paso de arriba **cuesta dinero y
      # no es repetible barato** (un lote de 37 contra la Batch API, hasta una
      # hora). Todo lo que viene después es fontanería de git, y si falla —un
      # permiso, un conflicto de rama— el contenido ya pagado se iría con la
      # máquina. Guardado como artefacto se puede recuperar y commitear a mano.
      - name: Guardar el contenido generado, pase lo que pase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diario-${{ steps.date.outputs.value }}
          path: content/daily/
          if-no-files-found: warn
          retention-days: 30

      # Los informes se sacan de **lo que git ve cambiado**, no recalculando las
      # fechas: es exactamente lo que este run ha producido, y no depende de que
      # la aritmética de fechas coincida con la del script. Si un día no llegó a
      # escribirse, aquí no aparece y el PR lo enseña por omisión.
      - name: Leer los informes del filtro para el cuerpo del PR
        id: report
        run: |
          {
            echo 'text<<EOF_REPORT'
            git status --porcelain content/daily | awk '{print $NF}' | grep '\.report\.md$' | sort | while read -r f; do
              echo "## $(basename "$f" .report.md)"
              cat "$f"
              echo
            done
            echo EOF_REPORT
          } >> "$GITHUB_OUTPUT"

      - name: Abrir PR con el contenido generado
        uses: peter-evans/create-pull-request@v6
        with:
          branch: content/daily-${{ steps.date.outputs.value }}
          commit-message: "contenido: diario ${{ steps.date.outputs.label }}"
          title: "Contenido diario — ${{ steps.date.outputs.label }}"
          body: ${{ steps.report.outputs.text }}
          # Glob y no la lista de fechas: `add-paths` solo indexa lo que ha
          # cambiado, así que las ediciones ya commiteadas no se tocan.
          add-paths: |
            content/daily/*.json
            content/daily/*.report.md
