# Cloudflare Workers · el origen del contenido diario (BRD §7.4, capa 2 · D11).
#
# **Sitio estático y nada más**: no hay `main`, así que no se despliega ningún
# Worker — solo los ficheros que monta `scripts/build-cdn.sh`. La cabecera de
# caché la pone `_headers`, dentro de esa misma carpeta.
#
# El flujo de Cloudflare para proyectos nuevos ya no pregunta por una carpeta de
# salida: construye con `bash scripts/build-cdn.sh` y despliega con
# `npx wrangler deploy`, que es quien lee esto.
#
# ⚠️ **`name` tiene que ser exactamente el del Worker en el panel.** Si no
# coincide, `wrangler deploy` no actualiza el tuyo: crea otro con este nombre y
# el dominio se queda apuntando al vacío.
name = "dogstrology"

# La fecha fija el comportamiento del runtime: subirla es optar por cambios
# nuevos, así que se toca a propósito y no por costumbre.
compatibility_date = "2026-09-01"

[assets]
directory = "./_site"

# **Un día que no existe tiene que dar 404**, y es el defecto: `CdnDailyRepository`
# lo lee como «ese día no está publicado», que no es un fallo sino un estado con
# pantalla propia (artboard 27). Si esto se pusiera a servir `index.html` en su
# lugar —el `single-page-application` que usan las apps web— la app recibiría
# HTML donde espera JSON y el día saldría roto en vez de no publicado.
not_found_handling = "none"

# **Una sola forma canónica, y sin barra final.** Es lo que ya hace el defecto
# con los ficheros que hay aquí, y se fija porque `/condiciones` va en la ficha
# de una tienda y en un texto legal: la dirección que se da ahí no puede
# depender de un defecto que cambie. `/condiciones/` y `/condiciones.html`
# redirigen a ella.
html_handling = "drop-trailing-slash"

# Los dos avisos que salieron en el primer despliegue, contestados a propósito
# en vez de dejados al defecto:
#
# `workers.dev` es la URL de prueba y hoy es la única que hay. **Pasa a `false`
# el día que el dominio propio esté sirviendo**: dos URL públicas con el mismo
# contenido son dos sitios que mantener, y la que se hornea en la app tiene que
# ser una sola.
workers_dev = true

# Y sin URL de previsualización: cada commit publicaría otra copia del diario en
# una dirección distinta, y aquí no hay nada que previsualizar — el contenido lo
# revisa una persona en el PR, antes de llegar.
preview_urls = false
